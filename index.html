<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinPoint — BBIT Campus Civic & Lost Item Platform</title>
    <meta name="description" content="PinPoint: A unified community platform for Budge Budge Institute of Technology (BBIT), Kolkata — routing Civic Issues and Lost & Found reports through a verified submit-to-resolve pipeline with satellite geotagging." />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#0071E3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PinPoint" />

    <!-- Dev/preview only: clear any stale service worker + caches so old builds never mask fresh changes -->
    <script>
      (function () {
        var h = location.hostname;
        var isPreview = h === 'localhost' || h === '127.0.0.1' || h.endsWith('.e2b.app');
        if (isPreview && 'serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              rs.forEach(function (r) { r.unregister(); });
            });
            if (window.caches) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              });
            }
          });
        }
      })();
    </script>
    
    <!-- Icons & Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <!-- Google Fonts: Inter (SF Pro stand-in for non-Apple devices) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="antialiased selection:bg-indigo-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
