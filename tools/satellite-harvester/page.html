<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BBIT Satellite Harvester</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #0b1220; color: #e6edf7; }
  header { padding: 14px 18px; border-bottom: 1px solid #1e293b; background: #0f172a;
           display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; }
  .pill { font-size: 11px; padding: 2px 9px; border-radius: 999px; background: #1e293b; border: 1px solid #334155; }
  main { padding: 16px 18px; display: grid; grid-template-columns: 1fr 380px; gap: 18px; }
  #log { background: #020617; border: 1px solid #1e293b; border-radius: 10px; padding: 10px 12px;
         height: 340px; overflow: auto; font: 11.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
  .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 12px 14px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed #1e293b; }
  .row:last-child { border-bottom: 0; }
  .ok { color: #4ade80; } .err { color: #f87171; } .dim { color: #94a3b8; }
  canvas { max-width: 100%; border: 1px solid #1e293b; border-radius: 10px; margin-top: 8px; background: #111; }
  #previewWrap { display: none; }
  button { background: #1d4ed8; color: white; border: 0; padding: 7px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  button.ghost { background: #1e293b; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>BBIT Satellite Harvester</h1>
  <span class="pill" id="statusPill">connecting…</span>
  <span class="pill dim">Esri World Imagery → mosaic → local disk</span>
  <span style="flex:1"></span>
  <button class="ghost" id="recheckBtn">Check for jobs</button>
</header>
<main>
  <section class="card">
    <strong>Activity</strong>
    <div id="log"></div>
  </section>
  <aside>
    <div class="card">
      <strong>Queue</strong>
      <div id="queue" class="dim" style="margin-top:6px">Waiting for job list…</div>
    </div>
    <div class="card" id="previewWrap" style="margin-top:14px">
      <strong>Last capture</strong>
      <canvas id="preview"></canvas>
    </div>
  </aside>
</main>
<script>
const logEl = document.getElementById('log');
const queueEl = document.getElementById('queue');
const pill = document.getElementById('statusPill');
const dot = document.getElementById('dot');
const previewWrap = document.getElementById('previewWrap');
const preview = document.getElementById('preview');

const MAX_TILES = 400;
const log = (msg, cls = '') => {
  const t = new Date().toLocaleTimeString();
  logEl.insertAdjacentHTML('beforeend', `<span class="dim">[${t}]</span> <span class="${cls}">${msg}</span>\n`);
  logEl.scrollTop = logEl.scrollHeight;
};

const lon2tile = (lon, z) => (lon + 180) / 360 * Math.pow(2, z);
const lat2tile = (lat, z) => {
  const r = lat * Math.PI / 180;
  return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z);
};
const tile2lon = (x, z) => x / Math.pow(2, z) * 360 - 180;
const tile2lat = (y, z) => {
  const n = Math.PI - 2 * Math.PI * y / Math.pow(2, z);
  return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
};

const PROVIDERS = [
  { name: 'Esri World Imagery', url: (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}` },
  { name: 'Esri (services host)', url: (z, x, y) => `https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}` },
  { name: 'OSM standard (fallback)', url: (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png` },
];

async function loadTile(provider, z, x, y) {
  const url = provider.url(z, x, y);
  // Preferred path: CORS-enabled fetch → decodable bitmap (keeps canvas untainted).
  try {
    const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
    if (res.ok) {
      const blob = await res.blob();
      if (blob.size > 100) return await createImageBitmap(blob);
    }
  } catch (e) { /* fall through to <img> */ }
  try {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    await new Promise((resolve, reject) => {
      img.onload = resolve; img.onerror = () => reject(new Error('img load failed'));
      img.src = url;
    });
    return img;
  } catch (e) { /* fall through */ }
  return null;
}

async function captureJob(job) {
  const { id, name, z, bbox, quality = 0.92 } = job;
  const [south, west, north, east] = bbox;
  const xMin = Math.floor(lon2tile(west, z));
  const xMax = Math.floor(lon2tile(east, z));
  const yMin = Math.floor(lat2tile(north, z));
  const yMax = Math.floor(lat2tile(south, z));
  const cols = xMax - xMin + 1;
  const rows = yMax - yMin + 1;
  log(`▶ ${name} — z${z}, ${cols}×${rows} tiles (${cols * rows})`, 'ok');
  if (cols * rows > MAX_TILES) { log(`   skipped: ${cols * rows} tiles > MAX_TILES(${MAX_TILES})`, 'err'); return { id, ok: false, error: 'too many tiles' }; }

  const canvas = document.createElement('canvas');
  canvas.width = cols * 256; canvas.height = rows * 256;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#0b0f14'; ctx.fillRect(0, 0, canvas.width, canvas.height);

  const tasks = [];
  for (let tx = 0; tx < cols; tx++) for (let ty = 0; ty < rows; ty++) tasks.push([tx, ty]);
  let cursor = 0, ok = 0, failed = 0, usedProvider = null;

  const worker = async (providerIndex) => {
    while (cursor < tasks.length) {
      const [tx, ty] = tasks[cursor++];
      const provider = PROVIDERS[providerIndex];
      const bmp = await loadTile(provider, z, xMin + tx, yMin + ty);
      if (bmp) {
        try { ctx.drawImage(bmp, tx * 256, ty * 256, 256, 256); ok++; usedProvider = provider.name; }
        catch (e) { failed++; }
      } else failed++;
    }
  };

  await Promise.all(Array.from({ length: 8 }, () => worker(0)));
  log(`   Esri primary: ${ok} ok / ${failed} failed`);
  if (failed > 0 && ok === 0) {
    log('   primary unavailable, retrying via secondary host…', 'err');
    cursor = 0; failed = 0; ok = 0;
    await Promise.all(Array.from({ length: 6 }, () => worker(1)));
    log(`   secondary: ${ok} ok / ${failed} failed`, ok ? '' : 'err');
  }
  if (ok === 0) { log('   no imagery available for this job', 'err'); return { id, ok: false, error: 'no tiles' }; }

  // ---- georeference grid -------------------------------------------------
  const pxPerLng = canvas.width / (tile2lon(xMax + 1, z) - tile2lon(xMin, z));
  const pxPerLat = canvas.height / (tile2lat(yMin, z) - tile2lat(yMax + 1, z));
  const originLng = tile2lon(xMin, z);
  const originLat = tile2lat(yMin, z);
  const xOf = (lng) => (lng - originLng) * pxPerLng;
  const yOf = (lat) => (originLat - lat) * pxPerLat;

  ctx.save();
  ctx.lineWidth = 1;
  const stepFine = 0.00025, stepLabel = 0.001;
  // fine grid
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath();
  for (let lat = Math.ceil(south / stepFine) * stepFine; lat <= north; lat += stepFine) {
    const y = Math.round(yOf(lat)) + 0.5; ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
  }
  for (let lng = Math.ceil(west / stepFine) * stepFine; lng <= east; lng += stepFine) {
    const x = Math.round(xOf(lng)) + 0.5; ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
  }
  ctx.stroke();

  // labelled grid (thicker + coordinate text)
  ctx.strokeStyle = 'rgba(56,189,248,0.85)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (let lat = Math.ceil(south / stepLabel) * stepLabel; lat <= north; lat += stepLabel) {
    const y = Math.round(yOf(lat)) + 0.5; ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
  }
  for (let lng = Math.ceil(west / stepLabel) * stepLabel; lng <= east; lng += stepLabel) {
    const x = Math.round(xOf(lng)) + 0.5; ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
  }
  ctx.stroke();

  ctx.font = 'bold 15px ui-monospace, Menlo, monospace';
  ctx.textBaseline = 'top';
  const label = (text, x, y, align = 'left') => {
    ctx.textAlign = align;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(2,6,23,0.92)'; ctx.strokeText(text, x, y);
    ctx.fillStyle = '#f8fafc'; ctx.fillText(text, x, y);
  };
  for (let lat = Math.ceil(south / stepLabel) * stepLabel; lat <= north; lat += stepLabel) {
    const y = Math.round(yOf(lat)) + 3;
    label(lat.toFixed(4), 6, y);
    label(lat.toFixed(4), canvas.width - 6, y, 'right');
  }
  for (let lng = Math.ceil(west / stepLabel) * stepLabel; lng <= east; lng += stepLabel) {
    const x = Math.round(xOf(lng)) + 5;
    label(lng.toFixed(4), x, 6);
    label(lng.toFixed(4), x, canvas.height - 22);
  }
  // corner + centre cross marks (handy anchors)
  const marks = [[south, west], [south, east], [north, west], [north, east]];
  ctx.strokeStyle = '#f97316'; ctx.lineWidth = 2;
  for (const [mlat, mlng] of marks) {
    const x = xOf(mlng), y = yOf(mlat);
    ctx.beginPath(); ctx.moveTo(x - 16, y); ctx.lineTo(x + 16, y); ctx.moveTo(x, y - 16); ctx.lineTo(x, y + 16); ctx.stroke();
  }
  ctx.restore();

  previewWrap.style.display = 'block';
  preview.width = canvas.width; preview.height = canvas.height;
  preview.getContext('2d').drawImage(canvas, 0, 0);

  const dataUrl = canvas.toDataURL('image/jpeg', quality);
  log(`   mosaic ${canvas.width}×${canvas.height}px, ${(dataUrl.length / 1365).toFixed(0)} KB → posting…`);
  const res = await fetch('/api/result', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      id, name, dataUrl,
      meta: { z, bbox, tiles: ok, provider: usedProvider, width: canvas.width, height: canvas.height,
              mPerPx: (156543.03392 * Math.cos(south * Math.PI / 180) / Math.pow(2, z)) },
    }),
  });
  const out = await res.json();
  log(`   ${out.ok ? '✔ saved ' + out.file : '✘ ' + out.error}`, out.ok ? 'ok' : 'err');
  return out;
}

let busy = false;
async function poll() {
  if (busy) return;
  busy = true;
  try {
    const res = await fetch('/api/jobs', { cache: 'no-store' });
    const { jobs, doneCount } = await res.json();
    dot.style.background = '#22c55e';
    pill.textContent = jobs.length ? `${jobs.length} job(s) pending` : `idle — ${doneCount} capture(s) done`;
    queueEl.innerHTML = jobs.length
      ? jobs.map((j) => `<div class="row"><span>${j.name}</span><span class="dim">z${j.z} · ${j.bbox.map(n => n.toFixed(4)).join(', ')}</span></div>`).join('')
      : '<span class="dim">No pending jobs. Waiting…</span>';
    for (const job of jobs) {
      try { await captureJob(job); }
      catch (e) { log(`✘ ${job.name}: ${e}`, 'err'); }
    }
  } catch (e) {
    dot.style.background = '#ef4444';
    pill.textContent = 'offline — retrying';
  } finally {
    busy = false;
  }
}

document.getElementById('recheckBtn').addEventListener('click', poll);
log('Harvester ready. This page stitches Esri World Imagery tiles for the BBIT campus and saves georeferenced mosaics to the workspace.');
poll();
setInterval(poll, 4000);
</script>
</body>
</html>
